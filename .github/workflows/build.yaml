name: Build and publish WYY Home Assistant App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            hass_arch: amd64
            suffix: amd64
          - platform: linux/arm64
            hass_arch: aarch64
            suffix: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ./wyy
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_ARCH=${{ matrix.hass_arch }}
          tags: ghcr.io/${{ github.repository_owner }}/wyy-ha:${{ steps.version.outputs.value }}-${{ matrix.suffix }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/wyy-ha:${{ steps.version.outputs.value }} \
            --tag ghcr.io/${{ github.repository_owner }}/wyy-ha:latest \
            ghcr.io/${{ github.repository_owner }}/wyy-ha:${{ steps.version.outputs.value }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/wyy-ha:${{ steps.version.outputs.value }}-aarch64
