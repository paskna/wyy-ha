name: Lint Home Assistant App

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - run: |
          yamllint -d '{extends: default, rules: {line-length: disable}}' repository.yaml wyy/config.yaml wyy/translations
      - run: test -f wyy/Dockerfile && test -x wyy/run.sh && test -f wyy/rootfs/etc/nginx/http.d/wyy.conf
      - name: Build and boot the app container
        run: docker build --build-arg BUILD_VERSION=0.1.1 --tag wyy-ha:smoke ./wyy
      - name: Prepare Supervisor option data
        run: |
          mkdir -p .wyy-ha-smoke-data
          printf '%s\n' '{"log_level":"info","timezone":"Europe/Zurich"}' > .wyy-ha-smoke-data/options.json
      - name: Start smoke-test container
        run: |
          docker run --detach --name wyy-ha-smoke --publish 127.0.0.1:8099:8099 --volume "$PWD/.wyy-ha-smoke-data:/data" wyy-ha:smoke
      - name: Wait for the HTTP service
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null --connect-timeout 1 http://127.0.0.1:8099/health; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' wyy-ha-smoke | grep --quiet true; then
              docker logs wyy-ha-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs wyy-ha-smoke
          exit 1
      - name: Verify PHP-FPM socket
        run: docker exec wyy-ha-smoke test -S /run/php/php-fpm.sock
      - name: Verify health HTTP status
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8099/health)
          echo "Health HTTP status: ${status}"
          test "${status}" = 200
      - name: Verify health response
        run: curl --fail --silent http://127.0.0.1:8099/health | grep --quiet '"status":"ok"'
      - name: Clean up smoke-test container
        if: always()
        run: |
          docker rm --force wyy-ha-smoke 2>/dev/null || true
          sudo rm -rf .wyy-ha-smoke-data
