name: WYY
version: "0.1.2"
slug: wyy
description: "Persoenliche Weinwelt mit Sammlung, Scan, Genussprofil und Empfehlungen."
url: "https://github.com/paskna/wyy-ha/tree/main/wyy"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:glass-wine
panel_title: WYY
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/health
backup: cold
stage: experimental
image: ghcr.io/paskna/wyy-ha
options:
  log_level: info
  timezone: Europe/Zurich
schema:
  log_level: list(trace|debug|info|warning|error)
  timezone: str?
